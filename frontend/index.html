<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Declare order before module CSS loads: the reset must precede Mantine controls. -->
    <style>@layer theme, base, mantine, components, utilities;</style>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Match the browser chrome to the active theme: parchment (light) is the
         default, night (dark) for users on a dark palette / OS preference. -->
    <meta name="theme-color" content="#f5f2ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080808" media="(prefers-color-scheme: dark)" />

    <!-- Primary Meta Tags -->
    <title>Michi — every conversation is a tree</title>
    <meta name="title" content="Michi — every conversation is a tree">
    <meta name="description" content="Branching chat for knowledge exploration. Fork any reply into a parallel branch, compare answers side by side, and weave them back together with digests. Your API key, your data, your tree.">
    <meta name="keywords" content="branching chat, michi, knowledge exploration, parallel conversations, AI research, digests, kiro">

    <!-- App Meta -->
    <meta name="application-name" content="Michi">
    <meta name="apple-mobile-web-app-title" content="Michi">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="msapplication-TileColor" content="#f5f2ee">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="format-detection" content="telephone=no">

    <!-- Open Graph / social sharing. Uses the existing 1480×824 card in
         public/. URLs are root-relative so they resolve on whatever origin
         serves the app; set an absolute og:url/og:image for production if you
         want reliable previews on crawlers that don't resolve relative paths. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Michi">
    <meta property="og:title" content="Michi — every conversation is a tree">
    <meta property="og:description" content="Branching chat for knowledge exploration. Fork any reply into a parallel branch, compare answers side by side, and weave them back together with digests.">
    <meta property="og:image" content="/og-image.png">
    <meta property="og:image:width" content="1480">
    <meta property="og:image:height" content="824">
    <meta property="og:image:alt" content="Michi — a branching tree of chat nodes on a parchment canvas">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Michi — every conversation is a tree">
    <meta name="twitter:description" content="Branching chat for knowledge exploration. Fork any reply, compare answers side by side, and weave them back together with digests.">
    <meta name="twitter:image" content="/og-image.png">

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Message typography (Source Serif 4 for chat body) + UI font presets.
         Three sans presets the user can pick from Settings → Interface font:
         IBM Plex Sans, Inter, Geist. IBM Plex Mono backs --font-mono for
         every preset except Geist, which pairs with Geist Mono. -->

<script>
      // Paint the saved terminal palette's background BEFORE React mounts so the
      // first frame matches it. Without this, dark-palette users see a light
      // flash while the bundle parses. This script cannot import modules: keep
      // the key, field, default and colors in sync with state/prefs.tsx
      // (PREFS_KEY, terminalPalette, DEFAULT_PREFS) and the palette bg values
      // in components/terminal/tokens.ts. state/prefs.firstFrame.test.ts checks.
      (function () {
        var BG = { bone: '#fdfdfc', slate: '#f3f4f6', monokai: '#272822', gruvbox: '#282828' };
        var palette = 'slate';
        try {
          var parsed = JSON.parse(localStorage.getItem('michi:v1:prefs') || 'null');
          if (parsed && Object.prototype.hasOwnProperty.call(BG, parsed.terminalPalette)) palette = parsed.terminalPalette;
        } catch (e) { /* ignore */ }
        document.documentElement.setAttribute('data-terminal-palette', palette);
        document.documentElement.style.background = BG[palette];
        document.documentElement.lang = navigator.language || 'en';
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"><div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;font-size:12px;color:#999;letter-spacing:.04em" id="pre-react-fallback"><span>loading…</span></div></div>
    <script>
      // React replaces this placeholder when it mounts. If a bundle download
      // stalls (seen over the phone tunnel), offer a reload instead of spinning.
      setTimeout(function () {
        var fallback = document.getElementById('pre-react-fallback');
        if (!fallback) return;
        var message = document.createElement('span');
        message.textContent = 'Michi did not finish loading.';
        var reload = document.createElement('button');
        reload.type = 'button';
        reload.textContent = 'Reload';
        reload.style.cssText = 'margin-left:10px;padding:6px 14px;font:inherit;color:inherit;background:none;border:1px solid currentColor;border-radius:6px;cursor:pointer';
        reload.onclick = function () { location.reload(); };
        fallback.replaceChildren(message, reload);
      }, 20000);
    </script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
