name: Michi
options:
  bundleIdPrefix: app.michi
  deploymentTarget:
    iOS: '17.0'
packages:
  MichiCore:
    path: .
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath.git
    exactVersion: 1.7.3
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: 5UCQ4QB5KH
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: 1
targets:
  Michi:
    type: application
    platform: iOS
    sources:
      - path: Sources/MichiApp
        excludes:
          - Resources/Fonts
          - Resources/PrivacyInfo.xcprivacy
      - path: Sources/MichiApp/Resources/Fonts
        type: folder
        buildPhase: resources
      - path: Sources/MichiApp/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: MichiCore
      - package: SwiftMath
    info:
      path: Sources/MichiApp/Resources/Michi-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - Fonts/Geist-Regular.ttf
          - Fonts/Geist-Medium.ttf
          - Fonts/Geist-SemiBold.ttf
          - Fonts/Geist-Bold.ttf
          - Fonts/GeistMono-Regular.ttf
          - Fonts/GeistMono-Medium.ttf
          - Fonts/GeistMono-SemiBold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.michi.ios
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Michi
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the Phone access QR code from desktop Michi, or take a photo to attach to a conversation.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Dictate text into a Michi draft when you tap the microphone.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Transcribe your voice on this device into a Michi draft.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your personal Michi backend on your local network.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
  MichiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Michi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Michi
  MichiAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: Michi
      - package: MichiCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Michi:
    build:
      targets:
        Michi: all
        MichiUITests: [test]
        MichiAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [MichiAppTests, MichiUITests]
      gatherCoverageData: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
